<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Shoalcheck">
  <title>Shoalcheck</title>
  <!-- The mark: the water's surface over a shoal's crest. The gap between them is the clearance a reading
       measures. Stroke 2 on a 24 grid, round caps; currentColor so it takes the surface's ink. -->
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8.5c1.3-1.2 2.7-1.2 4 0s2.7 1.2 4 0 2.7-1.2 4 0 2.7 1.2 4 0"/>
    <path d="M3.5 18.5c3.4 0 5-5 8.5-5s5.1 5 8.5 5"/>
  </g>
</svg>
