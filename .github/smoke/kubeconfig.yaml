# The recorded cluster (apiserver.py) under the name the Linux job's live kind cluster has, so every platform
# runs the same commands with the same context.
apiVersion: v1
kind: Config
clusters:
  - name: kind-smoke
    cluster:
      server: http://127.0.0.1:18080
contexts:
  - name: kind-smoke
    context:
      cluster: kind-smoke
      user: kind-smoke
current-context: kind-smoke
users:
  - name: kind-smoke
    user: {}
