name: release-smoke

# EVERY PUBLISHED FILE, ON EVERY PLATFORM IT CLAIMS. The landing page offers downloads for six platform pairs;
# this runs the published archives — not a fresh build — on each of them: on Linux against a real kind cluster,
# and on macOS and Windows, where no kind cluster can run, against that cluster's recorded answers
# (.github/smoke/apiserver.py), so every platform makes a real reading. A platform with no green run here is a
# platform nobody has seen work.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (empty: the newest published release, candidates included)"
        required: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    goos: linux,   goarch: amd64, ext: tar.gz, cluster: true }
          - { os: ubuntu-24.04-arm, goos: linux,   goarch: arm64, ext: tar.gz, cluster: true }
          - { os: macos-14,         goos: darwin,  goarch: arm64, ext: tar.gz, dmg: true }
          - { os: macos-15-intel,   goos: darwin,  goarch: amd64, ext: tar.gz, dmg: true }
          - { os: windows-latest,   goos: windows, goarch: amd64, ext: zip }
          - { os: windows-11-arm,   goos: windows, goarch: arm64, ext: zip }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_INPUT: ${{ inputs.tag || github.event.release.tag_name }}
      BIN: ${{ matrix.goos == 'windows' && '.exe' || '' }}
    steps:
      - name: The smoke's own files (the recorded cluster, the fixture)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/smoke

      - name: Which release
        run: |
          tag="$TAG_INPUT"
          [ -n "$tag" ] || tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName')
          echo "SHOALCHECK_HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VER=${tag#v}" >> "$GITHUB_ENV"
          echo "verifying $tag on ${{ matrix.goos }}/${{ matrix.goarch }} ($RUNNER_OS $RUNNER_ARCH)"

      - name: Download the published files
        run: |
          mkdir dl && cd dl
          app="shoalcheck-app_${VER}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.ext }}"
          [ "${{ matrix.goos }}" = darwin ] && app="Shoalcheck_${VER}_macos_universal.dmg"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            -p checksums.txt -p checksums.txt.sigstore.json \
            -p "shoalcheck_${VER}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.ext }}" \
            -p "shoalcheck-mcp_${VER}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.ext }}" \
            -p "kubectl-shoalcheck_${VER}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.ext }}" \
            -p "$app"
          ls -la
          echo "APP_FILE=$app" >> "$GITHUB_ENV"

      - name: The checksums match the files
        working-directory: dl
        run: |
          if command -v sha256sum >/dev/null; then sha256sum --ignore-missing -c checksums.txt
          else shasum -a 256 --ignore-missing -c checksums.txt; fi

      - name: Install cosign
        if: ${{ !(matrix.goos == 'windows' && matrix.goarch == 'arm64') }}
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.2

      # cosign publishes no Windows arm64 build and the installer refuses that runner, so Windows on Arm runs the
      # x64 build under the system's emulation, as a user there would: the same release the other five install,
      # checked against the sha256 in that release's cosign_checksums.txt.
      - name: Install cosign (Windows on Arm, the x64 build)
        if: ${{ matrix.goos == 'windows' && matrix.goarch == 'arm64' }}
        shell: pwsh
        env:
          COSIGN_URL: https://github.com/sigstore/cosign/releases/download/v2.5.2/cosign-windows-amd64.exe
          COSIGN_SHA256: fef1c4731da9112d4cf2f6d93ae2a1551c73116a4f73fab7b0c15b38e95ff688
        run: |
          $dir = Join-Path $env:RUNNER_TEMP cosign
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = Join-Path $dir cosign.exe
          Invoke-WebRequest -Uri $env:COSIGN_URL -OutFile $exe
          $got = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:COSIGN_SHA256) { throw "cosign.exe is $got, the release says $env:COSIGN_SHA256" }
          & $exe version
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: The checksums carry the published signature
        working-directory: dl
        # The key from this repository's own cosign.pub (checked out with the smoke's files — a root file is always in
        # a cone-mode checkout), never the release's copy: a key downloaded from the release it vouches for proves nothing.
        run: cosign verify-blob --key ../cosign.pub --bundle checksums.txt.sigstore.json checksums.txt

      - name: Unpack
        working-directory: dl
        run: |
          for f in shoalcheck_*.${{ matrix.ext }} shoalcheck-mcp_*.${{ matrix.ext }} kubectl-shoalcheck_*.${{ matrix.ext }}; do
            if [ "${{ matrix.ext }}" = zip ]; then pwsh -NoProfile -Command "Expand-Archive -Force '$f' ."; else tar xzf "$f"; fi
          done
          if [ "${{ matrix.goos }}" != darwin ]; then
            if [ "${{ matrix.ext }}" = zip ]; then pwsh -NoProfile -Command "Expand-Archive -Force '$APP_FILE' ."; else tar xzf "$APP_FILE"; fi
          fi
          ls -la

      - name: The command line answers without a cluster
        working-directory: dl
        run: |
          set -x
          ./shoalcheck$BIN version | tee version.txt
          grep -q "shoalcheck $VER" version.txt
          ./shoalcheck$BIN --help > help.txt 2>&1; grep -q 'shoalcheck licence' help.txt
          ./shoalcheck$BIN licence plans > plans.txt; grep -q 'Pro' plans.txt
          ./shoalcheck$BIN licence > licence.txt; grep -q 'plan      free' licence.txt
          ./shoalcheck$BIN audit --show-permissions > perms.txt; grep -q 'get,list' perms.txt
          set +e; ./shoalcheck$BIN fleet --context a --context b --output x.html 2> fleet.err; code=$?; set -e
          cat fleet.err; [ "$code" = 4 ] && grep -q Team fleet.err
          set +e; ./shoalcheck-mcp$BIN --print-identity 2> mcp.err; code=$?; set -e
          cat mcp.err; [ "$code" = 4 ]
          # The kubectl plugin is the same binary under kubectl's naming; the archive is published, so it is run.
          ./kubectl-shoalcheck$BIN version | tee plugin-version.txt
          grep -q "$VER" plugin-version.txt

      - name: The window's server starts and reads the licence (Windows, Linux)
        if: matrix.goos != 'darwin'
        working-directory: dl
        run: |
          ./shoalcheck-app$BIN --no-open --addr 127.0.0.1:47812 > app.out 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:47812/ -o index.html && break; sleep 0.5; done
          cat app.out
          grep -q '<title>Shoalcheck</title>' index.html
          # From 0.1.0-rc.3 the window's server answers /api/ only with the per-launch session token its own
          # page carries, so a page on another site cannot drive it. Read the token as the page does; a
          # release that serves none (rc.2) is asked without it, and one that serves it must refuse a
          # request that does not carry it.
          tok=$(sed -n 's/.*<meta name="shoalcheck-session" content="\([0-9a-f]*\)".*/\1/p' index.html | head -n 1)
          if [ -n "$tok" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47812/api/license)
            echo "without the session token: HTTP $code"; [ "$code" = 403 ]
            curl -fs -H "X-Shoalcheck-Session: $tok" http://127.0.0.1:47812/api/license | tee license.json
          else
            curl -fs http://127.0.0.1:47812/api/license | tee license.json
          fi
          grep -q '"unlicensed":true' license.json

      - name: The macOS app from the disk image starts and reads the licence
        if: matrix.dmg
        working-directory: dl
        run: |
          hdiutil attach "$APP_FILE" -nobrowse -readonly -mountpoint /tmp/sc-dmg
          ls /tmp/sc-dmg
          app=/tmp/sc-dmg/Shoalcheck.app/Contents/MacOS/Shoalcheck
          lipo -info "$app"
          "$app" --no-open --addr 127.0.0.1:47812 > app.out 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:47812/ -o index.html && break; sleep 0.5; done
          cat app.out
          grep -q '<title>Shoalcheck</title>' index.html
          # From 0.1.0-rc.3 the window's server answers /api/ only with the per-launch session token its own
          # page carries, so a page on another site cannot drive it. Read the token as the page does; a
          # release that serves none (rc.2) is asked without it, and one that serves it must refuse a
          # request that does not carry it.
          tok=$(sed -n 's/.*<meta name="shoalcheck-session" content="\([0-9a-f]*\)".*/\1/p' index.html | head -n 1)
          if [ -n "$tok" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47812/api/license)
            echo "without the session token: HTTP $code"; [ "$code" = 403 ]
            curl -fs -H "X-Shoalcheck-Session: $tok" http://127.0.0.1:47812/api/license | tee license.json
          else
            curl -fs http://127.0.0.1:47812/api/license | tee license.json
          fi
          grep -q '"unlicensed":true' license.json

      - name: A kind cluster config
        if: matrix.cluster
        run: |
          printf '%s\n' 'kind: Cluster' 'apiVersion: kind.x-k8s.io/v1alpha4' 'nodes:' \
            '  - role: control-plane' '  - role: worker' '  - role: worker' > "$RUNNER_TEMP/kind.yaml"

      - name: A kind cluster to read
        if: matrix.cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: smoke
          config: ${{ runner.temp }}/kind.yaml

      - name: Preflight and the free audit against it (Linux)
        if: matrix.cluster
        working-directory: dl
        run: |
          bash ../.github/smoke/fixture.sh
          set +e; ./shoalcheck preflight drain smoke-worker --context kind-smoke > drain.txt 2>&1; code=$?; set -e
          cat drain.txt; [ "$code" = 2 ] && grep -q 'cannot be evacuated' drain.txt
          ./shoalcheck audit --context kind-smoke > free.txt 2>/dev/null
          cat free.txt; grep -q 'the free reading' free.txt
          set +e; ./shoalcheck audit --context kind-smoke --output r.html > /dev/null 2> out.err; code=$?; set -e
          cat out.err; [ "$code" = 4 ] && [ ! -e r.html ]
          # kubectl finds the plugin by its name on PATH, and it answers the same drain the same way.
          export PATH="$PWD:$PATH"
          set +e; kubectl shoalcheck preflight drain smoke-worker --context kind-smoke > plugin-drain.txt 2>&1; code=$?; set -e
          cat plugin-drain.txt; [ "$code" = 2 ] && grep -q 'cannot be evacuated' plugin-drain.txt

      - name: Python for the recorded cluster
        if: ${{ !matrix.cluster }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preflight and the free audit against the recorded cluster (macOS, Windows)
        if: ${{ !matrix.cluster }}
        working-directory: dl
        run: |
          python ../.github/smoke/apiserver.py replay ../.github/smoke/recording.json > replay.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:18080/version > /dev/null && break; sleep 0.5; done
          cat replay.log
          cp ../.github/smoke/kubeconfig.yaml kubeconfig.yaml
          if command -v cygpath > /dev/null; then export KUBECONFIG="$(cygpath -w "$PWD/kubeconfig.yaml")"
          else export KUBECONFIG="$PWD/kubeconfig.yaml"; fi
          set +e; ./shoalcheck$BIN preflight drain smoke-worker --context kind-smoke > drain.txt 2>&1; code=$?; set -e
          cat drain.txt; [ "$code" = 2 ] && grep -q 'cannot be evacuated' drain.txt
          ./shoalcheck$BIN audit --context kind-smoke > free.txt 2>/dev/null
          cat free.txt; grep -q 'the free reading' free.txt
          set +e; ./shoalcheck$BIN audit --context kind-smoke --output r.html > /dev/null 2> out.err; code=$?; set -e
          cat out.err; [ "$code" = 4 ] && [ ! -e r.html ]
          if command -v kubectl > /dev/null; then
            export PATH="$PWD:$PATH"
            set +e; kubectl shoalcheck preflight drain smoke-worker --context kind-smoke > plugin-drain.txt 2>&1; code=$?; set -e
            cat plugin-drain.txt; [ "$code" = 2 ] && grep -q 'cannot be evacuated' plugin-drain.txt
          else
            echo "no kubectl on this runner: the plugin answered its version above, and kubectl's lookup is not exercised here"
          fi
          # A request the recording holds no answer for is a reading this platform did not fully make; a write is
          # listed here too, and the product makes none.
          curl -fs http://127.0.0.1:18080/__misses > misses.txt
          if [ -s misses.txt ]; then
            cat misses.txt
            echo "::error::the binary asked for answers the recording does not hold — re-record: .github/smoke/record.sh ./shoalcheck"
            exit 1
          fi
